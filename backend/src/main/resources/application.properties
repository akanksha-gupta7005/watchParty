# ---- Server ----
server.port=${PORT:8080}
spring.application.name=watchparty

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/watchparty}
spring.datasource.username=${DB_USER:watchparty}
spring.datasource.password=${DB_PASSWORD:watchparty}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Connection pooling (HikariCP) ----
# One pool is shared by all WebSocket and REST threads. Keep it small: free databases allow few connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ---- Watch Party settings ----
# Comma separated list of allowed browser origins (use * for development only)
watchparty.allowed-origins=${ALLOWED_ORIGINS:*}
# Seconds a disconnected user keeps their seat/role (page refresh, network blip)
watchparty.reconnect-grace-seconds=${RECONNECT_GRACE_SECONDS:30}
# Rooms not touched for this many days are deleted
watchparty.room-retention-days=${ROOM_RETENTION_DAYS:7}
# Video shown in a brand new room
watchparty.default-video-id=${DEFAULT_VIDEO_ID:M7lc1UVf-VE}
# Maximum number of people (seats) in one room
watchparty.max-participants-per-room=${MAX_PARTICIPANTS_PER_ROOM:100}

# ---- Authentication ----
# Secret used to sign login tokens. SET YOUR OWN LONG RANDOM VALUE IN PRODUCTION.
watchparty.auth-secret=${AUTH_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
# How many days a login stays valid
watchparty.auth-token-days=${AUTH_TOKEN_DAYS:7}

logging.level.com.watchparty=INFO
